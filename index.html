<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wax Flow Lamp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<meta name="theme-color" content="#0f0f11">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f0f11;
    --ink: rgba(255, 255, 255, 0.88);
    --muted: rgba(255, 255, 255, 0.46);
    --faint: rgba(255, 255, 255, 0.12);
    --line: rgba(255, 255, 255, 0.07);
    --panel: rgba(17, 17, 21, 0.68);
    --accent: #ff3a14;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* The lamp: a full-height, text-free stage */
  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .hero.dragging { cursor: grabbing; }
  .cue {
    position: absolute;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--muted);
    opacity: 0.55;
    cursor: pointer;
    transition: opacity 0.3s;
    animation: bob 3.2s ease-in-out infinite;
  }
  .cue:hover { opacity: 1; }
  @keyframes bob { 50% { transform: translate(-50%, 4px); } }
  @media (prefers-reduced-motion: reduce) { .cue { animation: none; } }

  /* Controls, underneath */
  .panel {
    position: relative;
    max-height: 64vh;
    max-height: 64svh;
    overflow-y: auto;
    background: var(--panel);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    backdrop-filter: blur(22px) saturate(1.3);
    border-top: 1px solid var(--line);
    border-radius: 22px 22px 0 0;
    scrollbar-width: thin;
    scrollbar-color: var(--faint) transparent;
  }
  .panel-inner {
    max-width: 540px;
    margin: 0 auto;
    padding: 10px 16px max(28px, env(safe-area-inset-bottom));
  }
  .grabber {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--faint);
    margin: 0 auto 6px;
  }

  details { border-bottom: 1px solid var(--line); }
  summary {
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 2px;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.2s;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover, details[open] > summary { color: var(--ink); }
  summary svg { transition: transform 0.25s ease; }
  details[open] > summary svg { transform: rotate(180deg); }
  summary:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; border-radius: 6px; }
  .group-body {
    display: grid;
    gap: 18px;
    padding: 2px 2px 22px;
  }

  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .row-head .val {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
  }
  .row-inline {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 28px;
  }

  input[type=range] {
    --p: 50%;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 1px;
    background: linear-gradient(to right, var(--accent) var(--p), var(--faint) var(--p));
  }
  input[type=range]::-moz-range-track { height: 2px; border-radius: 1px; background: var(--faint); }
  input[type=range]::-moz-range-progress { height: 2px; border-radius: 1px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -6px;
    border-radius: 50%;
    background: #f4f4f6;
    border: 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #f4f4f6;
    border: 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }
  input[type=range]:focus-visible { outline: none; }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--faint); }

  .switch {
    position: relative;
    width: 36px;
    height: 21px;
    border: 0;
    border-radius: 11px;
    background: var(--faint);
    cursor: pointer;
    transition: background 0.2s;
    padding: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2.5px;
    left: 2.5px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #f4f4f6;
    transition: transform 0.2s;
  }
  .switch[aria-checked=true] { background: var(--accent); }
  .switch[aria-checked=true]::after { transform: translateX(15px); }
  .switch:focus-visible { outline: 1px solid var(--muted); outline-offset: 3px; }

  input[type=color] {
    -webkit-appearance: none;
    appearance: none;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--faint);
    border-radius: 50%;
    background: none;
    cursor: pointer;
    overflow: hidden;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .chip:hover { border-color: var(--faint); background: rgba(255, 255, 255, 0.06); }
  .chip[aria-pressed=true] { border-color: rgba(255, 255, 255, 0.35); }
  .chip:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }
  .dots { display: inline-flex; }
  .dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.25);
  }
  .dots i + i { margin-left: -4px; }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 18px;
    color: var(--muted);
    font-size: 12px;
  }
  .text-btn {
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    padding: 6px 0;
    cursor: pointer;
  }
  .text-btn:hover { color: var(--ink); }
  .readout { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  .err {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  .err[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<main>
  <section class="hero" id="hero" aria-label="Wax flow lamp. Drag to turn it.">
    <button class="cue" id="cue" aria-label="Show controls">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </section>

  <section class="panel" id="panel" aria-label="Lamp controls">
    <div class="panel-inner">
      <div class="grabber"></div>
      <div id="groups"></div>
      <div class="footer">
        <span>Drag the lamp to turn it</span>
        <button class="text-btn" id="reset">Reset all</button>
      </div>
    </div>
  </section>
</main>

<div class="err" id="err" hidden></div>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
#define MAXB 16
#define PI 3.14159265

uniform vec2  uRes;
uniform vec2  uRegion;   // x: lamp centre (px from bottom), y: lamp region height (px)
uniform float uTime;
uniform vec2  uRot;      // cos/sin of the wax frame's turn
uniform float uPitch;
uniform float uZoom;
uniform vec4  uBlobs[MAXB];
uniform vec4  uInfo[MAXB];  // x: stretch, y: 1 if in the pool, z: cluster id, w: fusion blend
uniform int   uCount;
uniform vec3  uWax;
uniform vec3  uLiquid;
uniform vec3  uGlow;
uniform vec3  uMetal;
uniform float uRough;
uniform float uHaze;
uniform float uBulb;
uniform float uGoo;
uniform float uPoolY;
uniform float uEta;
uniform vec3  uTarget;   // camera target and distance
uniform float uDist;
uniform vec4  uLid;      // lid offset (xyz) and tilt (w)
uniform vec3  uBoxMin;   // bounds of everything solid, lid included
uniform vec3  uBoxMax;
uniform sampler2D uText; // lettering on the bottle cap

// Lamp geometry (world units, y up). Glass, base and cap are bodies of revolution.
const float GY0 = -0.80;  const float GY1 = 1.45;
const float BY0 = -2.00;  const float BY1 = -0.76;
const float CY0 = 1.38;   const float CY1 = 1.95;
const float FLOOR_Y = -2.0;
const float FILM = 0.004;    // the liquid film between blobs that have not fused: barely there

float glassR(float y) {
  float t = clamp((y - GY0) / (GY1 - GY0), 0.0, 1.0);
  float g = t + 0.35 * t * (1.0 - t);
  return mix(0.40, 0.24, t) + 0.22 * sin(PI * g);
}
float baseR(float y) {
  float t = clamp((y - BY0) / (BY1 - BY0), 0.0, 1.0);
  return mix(0.80, 0.43, t) - 0.06 * sin(PI * t);
}
float capR(float y) {
  float t = clamp((y - CY0) / (CY1 - CY0), 0.0, 1.0);
  return mix(0.27, 0.13, t);
}

// 2D profile distance -> rounded solid of revolution
float roundBox2(vec2 w, float rr) {
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - rr;
}

float sdGlass(vec3 p) {
  float r = length(p.xz);
  float dR = (glassR(p.y + 0.01) - glassR(p.y - 0.01)) * 50.0;
  float d = (r - glassR(p.y)) / sqrt(1.0 + dR * dR);
  return max(d, max(GY0 - p.y, p.y - GY1));
}
float sdBase(vec3 p) {
  float rr = 0.02;
  float dR = (baseR(p.y + 0.01) - baseR(p.y - 0.01)) * 50.0;
  vec2 w = vec2((length(p.xz) - baseR(p.y) + rr) / sqrt(1.0 + dR * dR),
                max(BY0 + rr - p.y, p.y - BY1 + rr));
  return roundBox2(w, rr);
}
float sdCap(vec3 p) {
  float rr = 0.04;
  float dR = (capR(p.y + 0.01) - capR(p.y - 0.01)) * 50.0;
  vec2 w = vec2((length(p.xz) - capR(p.y) + rr) / sqrt(1.0 + dR * dR),
                max(CY0 + rr - p.y, p.y - CY1 + rr));
  return roundBox2(w, rr);
}
float sdTorus(vec3 p, vec2 t) {
  return length(vec2(length(p.xz) - t.x, p.y)) - t.y;
}
float sdFoot(vec3 p) {
  float rr = 0.015;
  vec2 w = vec2(length(p.xz) - 0.835 + rr, max(BY0 + rr - p.y, p.y - (-1.93) + rr));
  return roundBox2(w, rr);
}

// Under the lid: the globe narrows to a neck sealed with a crown cap.
const float NY0 = 1.44;  const float NY1 = 1.52;   // neck (kept inside the lid)
const float KY0 = 1.508; const float KY1 = 1.582;  // crown cap
float neckR(float y) {
  float t = clamp((y - NY0) / (NY1 - NY0), 0.0, 1.0);
  return mix(0.243, 0.165, smoothstep(0.1, 1.0, t));
}
float sdNeck(vec3 p) {
  float rr = 0.006;
  float dR = (neckR(p.y + 0.01) - neckR(p.y - 0.01)) * 50.0;
  vec2 w = vec2((length(p.xz) - neckR(p.y) + rr) / sqrt(1.0 + dR * dR),
                max(NY0 + rr - p.y, p.y - NY1 + rr));
  return min(roundBox2(w, rr), sdTorus(p - vec3(0.0, NY1 - 0.006, 0.0), vec2(0.168, 0.012)));
}
// q is in the turning lamp frame so the flutes and lettering turn with it
float sdCrown(vec3 q) {
  float a = atan(q.z, q.x);
  float skirt = smoothstep(KY0 + 0.05, KY0 + 0.012, q.y);
  float R = 0.172 + 0.011 * skirt * (0.5 + 0.5 * cos(a * 21.0)) + 0.004 * skirt;
  vec2 w = vec2(length(q.xz) - R + 0.008, max(KY0 - q.y, q.y - KY1) + 0.008);
  return (roundBox2(w, 0.008)) * 0.6;
}
vec3 lidSpace(vec3 p) {
  vec3 pivot = vec3(0.0, 0.5 * (CY0 + CY1), 0.0);
  vec3 l = p - uLid.xyz - pivot;
  vec2 dir = length(uLid.xz) > 1e-3 ? normalize(uLid.xz) : vec2(1.0, 0.0);
  float a = dot(l.xz, dir), b = dot(l.xz, vec2(-dir.y, dir.x));
  float c = cos(uLid.w), s = sin(uLid.w);
  vec2 ay = vec2(c * a + s * l.y, -s * a + c * l.y);
  l = vec3(ay.x * dir.x - b * dir.y, ay.y, ay.x * dir.y + b * dir.x);
  return l + pivot;
}
vec3 lampFrame(vec3 p) {
  return vec3(uRot.x * p.x - uRot.y * p.z, p.y, uRot.y * p.x + uRot.x * p.z);
}

vec2 mapLamp(vec3 p) {
  float b = min(sdBase(p), sdFoot(p));
  b = min(b, sdTorus(p - vec3(0.0, BY1, 0.0), vec2(0.43, 0.02)));
  vec3 l = lidSpace(p);
  float c = min(sdCap(l), sdTorus(l - vec3(0.0, CY0, 0.0), vec2(0.272, 0.016)));
  float g = sdGlass(p);
  vec2 res = vec2(b, 1.0);
  if (c < res.x) res = vec2(c, 2.0);
  if (g < res.x) res = vec2(g, 3.0);
  if (p.y > NY0 - 0.05 && p.y < KY1 + 0.05) {
    float k = sdCrown(lampFrame(p));
    float n = sdNeck(p);
    if (k < res.x) res = vec2(k, 4.0);
    if (n < res.x) res = vec2(n, 5.0);
  } else {
    res.x = min(res.x, max(abs(p.y - 0.5 * (NY0 + KY1)) - 0.5 * (KY1 - NY0) - 0.04, length(p.xz) - 0.3));
  }
  return res;
}

// ---- Wax ---------------------------------------------------------------
float smin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}
float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-4);
}
// a stretched blob with its own slowly shifting lumps (seed keeps each blob distinct)
float sdBlob(vec3 p, vec4 b, float s, float seed) {
  float side = 1.0 / sqrt(s);
  vec3 l = p / b.w;
  float lump = sin(l.x * 2.9 + uTime * 0.37 + seed) * sin(l.y * 2.5 - uTime * 0.29 + seed * 1.7)
             * sin(l.z * 2.7 + uTime * 0.33 + seed * 2.3);
  return sdEllipsoid(p, b.w * vec3(side, s, side)) + b.w * 0.08 * lump;
}
float waxField(vec3 p) {
  // into the wax frame (the lamp turns; the room and its lights do not)
  vec3 q = vec3(uRot.x * p.x - uRot.y * p.z, p.y, uRot.y * p.x + uRot.x * p.z);
  // slow domain warp: lumpy, never-quite-round wax
  q += vec3(0.045, 0.03, 0.045) * sin(q.yzx * vec3(5.3, 4.1, 4.7) + uTime * vec3(0.31, 0.23, 0.27));
  // the pool, with the blobs resting in it melting in as their pool weight rises
  // (info.y: 2 + weight for blobs in the pool, weight alone for free blobs)
  float pool = q.y - uPoolY - 0.012 * sin(q.x * 7.0 + uTime * 0.35) * sin(q.z * 6.0 - uTime * 0.27);
  for (int i = 0; i < MAXB; i++) {
    if (i >= uCount) break;
    vec4 inf = uInfo[i];
    if (inf.y < 1.5) continue;
    vec4 b = uBlobs[i];
    float k = max(uGoo * b.w * 1.6 * (inf.y - 2.0), 1e-4);
    pool = smin(pool, sdBlob(q - b.xyz, b, inf.x, mod(inf.z, 17.0) * 1.3), k);
  }
  // free blobs: a liquid film keeps them apart (plain union, no blending) unless
  // they are fusing (same cluster), when a neck bridges the film as the bond grows
  float d = pool;
  float others = 1e5;  // blobs already placed; later ones flatten against them
  float cl = 1e5, cid = -1.0, ck = 0.1, cpw = 0.0;
  for (int i = 0; i < MAXB; i++) {
    if (i >= uCount) break;
    vec4 inf = uInfo[i];
    if (inf.y > 1.5) continue;
    vec4 b = uBlobs[i];
    float e = sdBlob(q - b.xyz, b, inf.x, mod(inf.z, 17.0) * 1.3);
    float k = uGoo * b.w * 1.6;
    if (inf.z != cid) {
      if (cid >= 0.0) {
        d = min(d, smin(max(cl, FILM - others), pool, max(ck * cpw, 1e-4)));
        others = min(others, cl);
      }
      cl = e; cid = inf.z; ck = k; cpw = inf.y;
    } else {
      ck = max(ck, k);
      cl = smin(cl, e, max(ck * inf.w, 1e-4));
    }
  }
  if (cid >= 0.0) d = min(d, smin(max(cl, FILM - others), pool, max(ck * cpw, 1e-4)));
  d += 0.005 * sin(q.x * 13.0 + uTime * 0.6) * sin(q.y * 11.0 - uTime * 0.5) * sin(q.z * 12.0 + uTime * 0.4);
  return d;
}
float sdWax(vec3 p) {
  return max(waxField(p), sdGlass(p) + 0.012);
}

// ---- Normals (tetrahedral) ---------------------------------------------
const vec2 KN = vec2(1.0, -1.0);
vec3 nLamp(vec3 p) {
  float e = 0.0008;
  return normalize(KN.xyy * mapLamp(p + KN.xyy * e).x + KN.yyx * mapLamp(p + KN.yyx * e).x +
                   KN.yxy * mapLamp(p + KN.yxy * e).x + KN.xxx * mapLamp(p + KN.xxx * e).x);
}
vec3 nGlass(vec3 p) {
  float e = 0.0008;
  return normalize(KN.xyy * sdGlass(p + KN.xyy * e) + KN.yyx * sdGlass(p + KN.yyx * e) +
                   KN.yxy * sdGlass(p + KN.yxy * e) + KN.xxx * sdGlass(p + KN.xxx * e));
}
vec3 nWax(vec3 p) {
  float e = 0.0015;
  return normalize(KN.xyy * sdWax(p + KN.xyy * e) + KN.yyx * sdWax(p + KN.yyx * e) +
                   KN.yxy * sdWax(p + KN.yxy * e) + KN.xxx * sdWax(p + KN.xxx * e));
}

// ---- Room ----------------------------------------------------------------
vec3 envMap(vec3 d, float rough) {
  vec3 c = vec3(0.010, 0.010, 0.013) * (0.6 + 0.4 * d.y);
  float az = atan(d.x, d.z);
  float w = 0.16 + rough * 0.9;
  // tall softbox, front-left
  float s1 = smoothstep(w, 0.0, abs(az + 0.95)) * smoothstep(-0.25 - rough, 0.1, d.y) * smoothstep(1.0, 0.55, d.y);
  c += vec3(0.92, 0.95, 1.0) * s1 * 1.5 * (1.0 - rough * 0.55);
  // dimmer warm strip, right
  float s2 = smoothstep(w * 1.5, 0.0, abs(az - 1.55)) * smoothstep(-0.3, 0.25, d.y) * smoothstep(0.9, 0.35, d.y);
  c += vec3(1.0, 0.86, 0.72) * s2 * 0.4;
  c += vec3(0.035) * smoothstep(0.55, 1.0, d.y);
  c += uGlow * 0.12 * smoothstep(0.0, -0.6, d.y);
  return c;
}

vec3 background(vec3 ro, vec3 rd) {
  vec3 c = vec3(0.0055, 0.0055, 0.007);
  if (rd.y < -0.001) {
    float t = (FLOOR_Y - ro.y) / rd.y;
    if (t > 0.0) {
      vec3 p = ro + rd * t;
      float r = length(p.xz);
      vec3 gp = vec3(0.0, 0.15, 0.0) - p;
      float lit = 1.6 / (1.0 + dot(gp, gp) * 1.1);
      float occ = smoothstep(0.80, 1.7, r);
      c += uGlow * 0.24 * lit * occ;
    }
  }
  return c;
}

// soft glow around the glass, for pixels that miss the lamp
vec3 halo(vec3 ro, vec3 rd) {
  vec2 o = ro.xz, d = rd.xz;
  float t = max(-dot(o, d) / max(dot(d, d), 1e-5), 0.0);
  vec3 p = ro + rd * t;
  float y = clamp(p.y, GY0, GY1);
  float hd = length(vec2(max(length(p.xz) - glassR(y), 0.0), p.y - y));
  return uGlow * (0.035 * exp(-hd * 1.2) + 0.05 * exp(-hd * 5.0));
}

// ---- Shading -----------------------------------------------------------
vec3 shadeWax(vec3 p, vec3 rd) {
  vec3 n = nWax(p);
  vec3 L = normalize(vec3(0.0, GY0 - 0.3, 0.0) - p);
  float h = clamp((p.y - GY0) / (GY1 - GY0), 0.0, 1.0);
  float heat = 0.22 + 0.78 * exp(-h * 2.4);
  float wrap = pow(clamp(dot(n, L) * 0.5 + 0.5, 0.0, 1.0), 2.0);
  float thin = clamp(1.0 + waxField(p - n * 0.10) / 0.10, 0.0, 1.0);
  float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);
  vec3 wc = uWax;

  vec3 c = wc * wc * 0.05 * uBulb + wc * 0.008;
  c += wc * wrap * heat * 1.5 * uBulb;                          // lit from the bulb below
  c += wc * (0.18 + 0.9 * thin) * heat * uBulb;                  // translucency, necks glow
  c += wc * 1.2 * uBulb * exp(-max(p.y - GY0, 0.0) * 4.5);       // hot pool
  c += mix(wc, uLiquid, 0.4) * fres * 0.45 * heat * uBulb;       // rim
  vec3 H = normalize(normalize(vec3(-0.55, 0.65, 0.55)) - rd);
  c += vec3(0.8) * pow(max(dot(n, H), 0.0), 70.0) * 0.45;        // gloss
  c += envMap(reflect(rd, n), 0.15) * (0.02 + 0.25 * fres);
  return c;
}

vec3 interior(vec3 ro, vec3 rd) {
  vec3 acc = vec3(0.0);
  vec3 T = vec3(1.0);
  vec3 absorb = (1.0 - uLiquid) * 0.55 + uHaze * 0.35;
  vec3 hazeCol = mix(uLiquid, uWax, 0.25) * uBulb * uHaze;
  float t = 0.0;
  for (int i = 0; i < 96; i++) {
    vec3 p = ro + rd * t;
    float g = sdGlass(p);
    float w = max(waxField(p), g + 0.012);
    if (w < 0.0015) return acc + T * shadeWax(p, rd);
    if (g > 0.0005) {
      vec3 bg = p.y < GY0 + 0.06 ? uGlow * 1.5 : background(p, rd);
      return acc + T * bg;
    }
    float st = clamp(min(w * 0.75, -g + 0.004), 0.003, 0.25);
    float my = p.y + rd.y * st * 0.5;
    acc += T * hazeCol * (0.10 + 0.9 * exp(-max(my - uPoolY, 0.0) * 2.2)) * st;
    T *= exp(-absorb * st);
    t += st;
  }
  return acc + T * background(ro + rd * t, rd);
}

vec3 shadeMetal(vec3 p, vec3 n, vec3 rd, vec3 metal, float rough) {
  float ci = clamp(dot(n, -rd), 0.0, 1.0);
  vec3 F = metal + (1.0 - metal) * pow(1.0 - ci, 5.0);
  vec3 c = envMap(reflect(rd, n), rough) * F * 2.0;
  vec3 gl = vec3(0.0, -0.3, 0.0) - p;
  float gd = length(gl);
  c += uGlow * mix(metal, vec3(0.3), 0.2) * max(dot(n, gl / gd), 0.0) * 0.9 / (1.0 + gd * gd * 3.0);
  vec3 H = normalize(normalize(vec3(-0.55, 0.65, 0.55)) - rd);
  c += metal * pow(max(dot(n, H), 0.0), mix(180.0, 12.0, rough)) * (1.0 - rough * 0.7) * 0.6;
  c += metal * 0.015 * rough;
  return c;
}

// gold crown cap with raised script lettering on top
vec3 shadeCrown(vec3 p, vec3 n, vec3 rd) {
  vec3 q = lampFrame(p);
  float ink = 0.0;
  if (n.y > 0.6 && q.y > KY1 - 0.012) {
    const float SPAN = 0.30;
    vec2 uv = q.xz / SPAN + 0.5;
    float e = 1.5 / 512.0;
    ink = texture2D(uText, uv).a;
    float ix = texture2D(uText, uv + vec2(e, 0.0)).a;
    float iz = texture2D(uText, uv + vec2(0.0, e)).a;
    // emboss: slope of the lettering, turned back into world space
    vec2 g = vec2(ix - ink, iz - ink) * 0.35;
    vec2 gw = vec2(uRot.x * g.x + uRot.y * g.y, -uRot.y * g.x + uRot.x * g.y);
    n = normalize(n - vec3(gw.x, 0.0, gw.y));
  }
  vec3 K = normalize(vec3(-0.55, 0.65, 0.55));
  vec3 H = normalize(K - rd);
  float dif = max(dot(n, K), 0.0);
  float spec = max(dot(n, H), 0.0);
  float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
  vec3 gold = vec3(1.0, 0.62, 0.2);
  vec3 metal = gold * (0.04 + 0.38 * dif) + gold * pow(spec, 40.0) * 0.9
             + envMap(reflect(rd, n), 0.25) * (gold + (1.0 - gold) * fres) * 1.5
             + uGlow * gold * 0.25 * max(-n.y, 0.0);
  vec3 paint = vec3(0.30, 0.035, 0.025) * (0.05 + 0.6 * dif) + vec3(0.3) * pow(spec, 60.0) * 0.3;
  return mix(metal, paint, ink);
}

vec2 boxHit(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax) {
  vec3 inv = 1.0 / (rd + vec3(1e-7));
  vec3 t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tmin = min(t0, t1), tmax = max(t0, t1);
  return vec2(max(max(tmin.x, tmin.y), tmin.z), min(min(tmax.x, tmax.y), tmax.z));
}

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - vec2(uRes.x * 0.5, uRegion.x)) / uRegion.y;

  vec3 ta = uTarget;
  vec3 ro = ta + uDist * vec3(0.0, sin(uPitch), cos(uPitch));
  vec3 fw = normalize(ta - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.38 * uZoom * fw);

  vec3 col;
  bool hit = false;
  float t = 0.0;
  float mat = 0.0;
  vec2 tb = boxHit(ro, rd, uBoxMin, uBoxMax);
  if (tb.x < tb.y && tb.y > 0.0) {
    t = max(tb.x, 0.0);
    for (int i = 0; i < 110; i++) {
      vec2 m = mapLamp(ro + rd * t);
      if (m.x < 0.0008) { hit = true; mat = m.y; break; }
      t += m.x * 0.9;
      if (t > tb.y) break;
    }
  }

  if (hit) {
    vec3 p = ro + rd * t;
    if (mat > 4.5) {
      // the neck: thin glass lit by the glowing liquid below
      vec3 n = nLamp(p);
      float F = 0.04 + 0.96 * pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
      vec3 inner = uGlow * 0.16 + mix(uLiquid, uWax, 0.3) * uBulb * 0.04;
      col = mix(inner, envMap(reflect(rd, n), 0.02), F) + envMap(reflect(rd, n), 0.02) * 0.05;
    } else if (mat > 3.5) {
      col = shadeCrown(p, nLamp(p), rd);
    } else if (mat > 2.5) {
      vec3 n = nGlass(p);
      float ci = clamp(dot(n, -rd), 0.0, 1.0);
      float F = 0.03 + 0.97 * pow(1.0 - ci, 5.0);
      vec3 refl = envMap(reflect(rd, n), 0.02);
      vec3 r2 = refract(rd, n, uEta);
      if (dot(r2, r2) < 0.01) r2 = rd;
      vec3 inner = interior(p - n * 0.006, r2);
      col = mix(inner, refl, F) + refl * 0.05;
      vec3 H = normalize(normalize(vec3(-0.55, 0.65, 0.55)) - rd);
      col += vec3(1.0) * pow(max(dot(n, H), 0.0), 220.0) * 0.8;
    } else {
      col = shadeMetal(p, nLamp(p), rd, uMetal, uRough);
    }
  } else {
    col = background(ro, rd) + halo(ro, rd);
  }

  col = aces(col * 1.05);
  col = pow(col, vec3(1.0 / 2.2));
  float dither = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  col += (dither - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(() => {
  'use strict';

  const MAXB = 16;
  const STORE_KEY = 'waxflowlamp.settings.v1';

  const DEFAULTS = {
    power: true,
    heat: 0.75,
    flow: 1,
    viscosity: 1,
    wax: '#ff3a14',
    amount: 8,
    size: 1,
    goo: 1,
    liquid: '#ffc23d',
    haze: 0.35,
    bulb: 1,
    finish: 'chrome',
    refraction: 0.5,
    autorotate: true,
    spin: 0.25,
    zoom: 1,
    quality: 0.75,
    adaptive: true,
  };

  const PRESETS = [
    { name: 'Classic',  wax: '#ff3a14', liquid: '#ffc23d', haze: 0.35, finish: 'chrome' },
    { name: 'Original', wax: '#ff7b1c', liquid: '#f4efe2', haze: 0.25, finish: 'brushed' },
    { name: 'Ocean',    wax: '#1f9bff', liquid: '#38f0d0', haze: 0.35, finish: 'chrome' },
    { name: 'Violet',   wax: '#c53bff', liquid: '#3a62ff', haze: 0.40, finish: 'black' },
    { name: 'Lime',     wax: '#a6ff2a', liquid: '#9a3bff', haze: 0.40, finish: 'chrome' },
    { name: 'Blush',    wax: '#ff4f8f', liquid: '#ffd7e6', haze: 0.30, finish: 'copper' },
    { name: 'Ember',    wax: '#ffb21a', liquid: '#ff3b2f', haze: 0.45, finish: 'gold' },
    { name: 'Glacier',  wax: '#f4f7ff', liquid: '#3d7bff', haze: 0.35, finish: 'brushed' },
  ];

  const FINISHES = {
    chrome:  { label: 'Chrome',  metal: [0.92, 0.92, 0.94], rough: 0.04 },
    brushed: { label: 'Brushed', metal: [0.78, 0.78, 0.80], rough: 0.38 },
    gold:    { label: 'Gold',    metal: [1.00, 0.74, 0.32], rough: 0.12 },
    copper:  { label: 'Copper',  metal: [0.95, 0.60, 0.48], rough: 0.18 },
    black:   { label: 'Black',   metal: [0.05, 0.05, 0.06], rough: 0.45 },
  };

  const S = Object.assign({}, DEFAULTS);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved && typeof saved === 'object') {
      for (const k of Object.keys(DEFAULTS)) if (typeof saved[k] === typeof DEFAULTS[k]) S[k] = saved[k];
    }
  } catch (e) { /* storage unavailable: run on defaults */ }
  let saveTimer = 0;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
    }, 250);
  }

  // SIM-BEGIN ---------------------------------------------------------------
  // Wax physics: each blob carries a temperature. The pool at the bottom heats it,
  // the liquid cools it (more so near the top), and buoyancy follows temperature.
  // Blobs stick to the pool until hot enough and to the top until cool enough,
  // which gives the slow, staggered wax-lamp cycle.
  //
  // Blobs that meet do not merge on contact. A thin film of liquid keeps them
  // apart, so they slide past while a fusion bond builds: faster the harder they
  // press (more shared surface) and the closer their temperatures, which slowly
  // even out through the film. Some pairs are sticky and fuse almost on impact.
  // When the film breaks the pair grows a neck, then the
  // smaller blob drains into the larger. Big merged blobs sometimes pinch off a
  // trailing piece, and merged wax splits up again when it melts into the pool.
  const GY0 = -0.80, GY1 = 1.45;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const rand = (a, b) => a + Math.random() * (b - a);
  function glassR(y) {
    const t = clamp01((y - GY0) / (GY1 - GY0));
    const g = t + 0.35 * t * (1 - t);
    return 0.40 + (0.24 - 0.40) * t + 0.22 * Math.sin(Math.PI * g);
  }

  const DROP_T = 0.42;    // leaves the top below this
  const VSCALE = 0.9;     // buoyancy -> velocity
  const MAX_BASE = 0.24;  // largest a merged blob may grow
  const FILM = 0.006;     // liquid film kept between blobs that have not fused
  const LUMP = 1.0;       // the shader flattens any lump that would cross the film

  const sim = { t: 0, heat: 1, blobs: [], pairs: new Map(), nextId: 1, stats: { contacts: 0, fusions: 0 } };

  const poolY = () => GY0 + 0.15 + 0.005 * S.amount;
  const restY = b => poolY() - b.r * 0.55 + b.r * 0.5 * clamp01((b.temp - 0.4) / (b.rise - 0.4));
  const topY = b => GY1 - 0.06 - b.r * 0.7;
  const newBase = () => rand(0.08, 0.16);

  function newBlob(state) {
    const b = {
      id: sim.nextId++, active: true, mass: 1, fuse: null, split: null, coolWith: null, coolUntil: 0,
      x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
      base: 0, goal: newBase(), cap: rand(0.6, 1.6), f: rand(0.6, 1.4),
      ph: [rand(0, 6.283), rand(0, 6.283), rand(0, 6.283)],
      temp: 0.35, s: 1, r: 0.1, state: 'pool', rise: rand(0.68, 0.8),
      poolW: 1,  // how far it has melted into (or still trails from) the pool
    };
    b.base = b.goal;
    b.r = b.base * S.size;
    const a = rand(0, 6.283), rr = rand(0, 0.28);
    b.x = Math.cos(a) * rr;
    b.z = Math.sin(a) * rr;
    if (state === 'pool') {
      b.temp = rand(0.35, 0.62);
      b.y = restY(b);
    } else {
      b.state = 'free';
      b.y = rand(poolY() + 0.3, GY1 - 0.35);
      b.temp = Math.random() < 0.5 ? rand(0.58, 0.72) : rand(0.28, 0.42);
      b.vy = (b.temp - 0.5) * VSCALE / S.viscosity;
      b.poolW = b.vy > 0 ? 1 : 0;
    }
    return b;
  }

  // a blob reborn in the pool, growing up out of it
  function respawn(b, near) {
    const fresh = newBlob('pool');
    Object.assign(b, fresh, { id: b.id });
    b.base = 0.02;
    b.r = b.base * S.size;
    const a = rand(0, 6.283);
    b.x = near.x + Math.cos(a) * 0.1;
    b.z = near.z + Math.sin(a) * 0.1;
    b.y = poolY() - 0.05;
    b.temp = rand(0.35, 0.5);
  }

  function syncBlobCount() {
    while (sim.blobs.length < S.amount) sim.blobs.push(newBlob('pool'));
    if (sim.blobs.length > S.amount) {
      sim.blobs.sort((a, b) => b.active - a.active);
      sim.blobs.length = S.amount;
      for (const b of sim.blobs) if (b.fuse && !b.fuse.into.active) b.fuse = null;
      for (const [k, p] of sim.pairs) if (!sim.blobs.includes(p.a) || !sim.blobs.includes(p.c)) sim.pairs.delete(k);
    }
  }

  function seedBlobs() {
    sim.blobs = [];
    sim.pairs.clear();
    for (let i = 0; i < S.amount; i++) sim.blobs.push(newBlob(i < 3 ? 'pool' : 'free'));
  }

  const rootOf = b => { while (b.fuse) b = b.fuse.into; return b; };
  // blobs drawn as one gooey body: a fusing pair, or a blob and the piece pinching off it
  function clusterId(b) {
    for (let i = 0; i < 32; i++) {
      if (b.fuse) b = b.fuse.into;
      else if (b.split) b = b.split.from;
      else break;
    }
    return b.id;
  }
  const blend = b => b.fuse ? b.fuse.w : b.split ? b.split.w : 0;

  // a merged blob pinches off part of itself; the piece is a little cooler or warmer,
  // so it trails behind until the neck thins and snaps
  function startSplit(o, p) {
    Object.assign(o, newBlob('free'), { id: o.id });
    const dir = p.vy >= 0 ? 1 : -1;
    o.base = o.goal = 0.02;
    o.r = o.base * S.size;
    o.x = p.x + rand(-0.02, 0.02);
    o.z = p.z + rand(-0.02, 0.02);
    o.y = p.y - dir * p.r * 0.35;
    o.vx = p.vx; o.vy = p.vy; o.vz = p.vz;
    o.temp = p.temp - dir * 0.07;
    o.s = p.s;
    o.poolW = p.poolW;
    o.split = { from: p, w: 1, age: 0, vol: p.base ** 3 * rand(0.3, 0.5) };
    p.mass--;
  }

  // effective radius of a stretched blob along a direction with vertical component ny
  const reach = (b, ny) => b.r * LUMP * (b.s * Math.abs(ny) + (1 - Math.abs(ny)) / Math.sqrt(b.s));

  // hold the film between two unfused blobs, deflecting sideways so they slide past
  function separate(a, c, side) {
    const dx = c.x - a.x, dy = c.y - a.y, dz = c.z - a.z;
    const d = Math.hypot(dx, dy, dz) || 1e-4;
    const nx = dx / d, ny = dy / d, nz = dz / d;
    const contact = reach(a, ny) + reach(c, ny) + FILM;
    if (d >= contact) return;
    const corr = (contact - d) * 0.5;
    const hl = Math.hypot(nx, nz);
    let lx = Math.cos(side), lz = Math.sin(side);
    if (hl > 1e-3) { lx = nx / hl; lz = nz / hl; }
    const lat = Math.max(0, 0.7 - hl) * 0.6;
    a.x -= (nx + lx * lat) * corr; a.y -= ny * corr; a.z -= (nz + lz * lat) * corr;
    c.x += (nx + lx * lat) * corr; c.y += ny * corr; c.z += (nz + lz * lat) * corr;
    const rel = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny + (c.vz - a.vz) * nz;
    if (rel < 0) {
      a.vx += nx * rel * 0.5; a.vy += ny * rel * 0.5; a.vz += nz * rel * 0.5;
      c.vx -= nx * rel * 0.5; c.vy -= ny * rel * 0.5; c.vz -= nz * rel * 0.5;
    }
  }

  // keep a blob inside the glass, above the pool and below the top
  function contain(b) {
    const ry = poolY() - b.r * 0.55, ty = topY(b);
    if (b.y < ry - 0.02) { b.y = ry - 0.02; if (b.vy < 0) b.vy = 0; }
    if (b.y > ty + 0.01) { b.y = ty + 0.01; if (b.vy > 0) b.vy = 0; }
    const rr = Math.hypot(b.x, b.z);
    const maxR = Math.max(0, glassR(b.y) - b.r * 0.8 - 0.015);
    if (rr > maxR) {
      const f = maxR / rr;
      b.x *= f; b.z *= f;
      b.vx *= 0.5; b.vz *= 0.5;
    }
  }

  const separable = b => b.active && b.state !== 'pool' && !b.fuse && !b.split;

  function stepSim(dt) {
    sim.t += dt;
    const heat = S.heat * sim.heat;
    const visc = S.viscosity;
    const blobs = sim.blobs;

    for (const b of blobs) {
      if (!b.active) continue;
      b.base += (b.goal - b.base) * (1 - Math.exp(-dt * 0.35));
      b.r = b.base * S.size * (1 + 0.05 * Math.sin(sim.t * 0.23 + b.ph[0]));
      const h = clamp01((b.y - GY0) / (GY1 - GY0));

      // temperature
      let target, k;
      if (b.state === 'pool') {
        target = 0.45 + 0.5 * heat;
        k = 0.15;
      } else {
        target = 0.2 + 0.25 * heat * (1 - h);
        k = 0.03 * (1 + 3 * smooth(0.7, 1, h));
      }
      b.temp += (target - b.temp) * (1 - Math.exp(-k * dt / b.cap));

      // vertical motion
      if (b.state === 'pool') {
        b.vy = (restY(b) - b.y) * 0.8;
        if (b.temp > b.rise) { b.state = 'free'; b.vy = 0.004; }
      } else if (b.state === 'top') {
        b.vy = (topY(b) - b.y) * 0.6;
        if (b.temp < DROP_T) { b.state = 'free'; b.vy = -0.004; }
      } else {
        // bigger blobs move a little faster, as in a real viscous liquid
        const vt = (b.temp - 0.5) * VSCALE / visc * Math.min(1.5, Math.max(0.75, b.base / 0.11));
        b.vy += (vt - b.vy) * (1 - Math.exp(-dt * 1.2 / visc));
      }

      // a sinking blob lets go of the pool; a resting one melts into it
      if (b.state === 'pool') b.poolW = Math.min(1, b.poolW + dt / 1.5);
      else if (b.vy < 0) b.poolW = Math.max(0, b.poolW - dt);

      // slow sideways wander
      const R = glassR(b.y);
      const wander = R * (b.state === 'pool' ? 0.55 : 0.4);
      const tx = wander * Math.sin(sim.t * 0.05 * b.f + b.ph[1]);
      const tz = wander * Math.sin(sim.t * 0.043 * b.f + b.ph[2]);
      const spring = b.state === 'pool' ? 0.02 : 0.06;
      b.vx += ((tx - b.x) * spring - b.vx * 0.8) * dt;
      b.vz += ((tz - b.z) * spring - b.vz * 0.8) * dt;

      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.z += b.vz * dt;
    }

    // contact: press, slide, trade heat, build a bond
    for (const p of sim.pairs.values()) p.touch = false;
    for (let i = 0; i < blobs.length; i++) {
      const a = blobs[i];
      if (!a.active || a.state === 'pool' || a.fuse || a.split) continue;
      for (let j = i + 1; j < blobs.length; j++) {
        const c = blobs[j];
        if (!c.active || c.state === 'pool' || c.fuse || c.split) continue;
        const dx = c.x - a.x, dy = c.y - a.y, dz = c.z - a.z;
        const d = Math.hypot(dx, dy, dz) || 1e-4;
        const nx = dx / d, ny = dy / d, nz = dz / d;
        const contact = reach(a, ny) + reach(c, ny) + FILM;
        if (d > contact + 0.012) continue;

        const key = a.id < c.id ? a.id * 4096 + c.id : c.id * 4096 + a.id;
        let pair = sim.pairs.get(key);
        if (!pair) {
          // most pairs are reluctant; a few are sticky and fuse on the bump
          // (and a freshly split pair won't rejoin straight away)
          const sticky = Math.random() < 0.25;
          const justSplit = sim.t < Math.max(a.coolWith === c ? a.coolUntil : 0, c.coolWith === a ? c.coolUntil : 0);
          const stick = justSplit ? 0 : sticky ? rand(5, 10) : rand(0.04, 0.3);
          pair = { a, c, prog: 0, stick, side: rand(0, 6.283), apart: 0 };
          sim.pairs.set(key, pair);
          sim.stats.contacts++;
        }
        pair.touch = true;
        pair.apart = 0;

        // the film insulates: heat crosses it only slowly
        const m = (c.temp - a.temp) * Math.min(1, dt * 0.05);
        a.temp += m; c.temp -= m;

        const press = clamp01((contact - d) / 0.02);
        const sameTemp = clamp01(1 - Math.abs(a.temp - c.temp) / 0.12);
        pair.prog += dt * pair.stick * (0.15 + press * 2) * (0.2 + 0.8 * sameTemp);
        if (pair.prog >= 1) {
          const [big, small] = a.base >= c.base ? [a, c] : [c, a];
          small.fuse = { into: big, w: 0, age: 0 };
          sim.pairs.delete(key);
          sim.stats.fusions++;
          if (a.fuse) break;
          continue;
        }

        separate(a, c, pair.side);
      }
    }
    for (const [k, p] of sim.pairs) {
      // an encounter keeps its temperament until the two have been apart a while
      if (!p.touch) { p.prog = Math.max(0, p.prog - dt * 0.3); p.apart += dt; }
      if (p.apart > 2 || !p.a.active || !p.c.active || p.a.fuse || p.c.fuse) {
        if (p.a.active && p.c.active && !p.a.fuse && !p.c.fuse) sim.stats.slid = (sim.stats.slid || 0) + 1;
        sim.pairs.delete(k);
      }
    }

    // pinching off
    for (const p of blobs) {
      if (!p.active || p.state !== 'free' || p.fuse || p.split || p.mass < 2 || p.base < 0.12) continue;
      if (Math.random() < dt * 0.06) {
        const o = blobs.find(x => !x.active);
        if (o) startSplit(o, p);
      }
    }
    for (const b of blobs) {
      if (!b.active || !b.split) continue;
      const p = b.split.from;
      if (!p.active) { b.split = null; continue; }
      const sp = b.split;
      sp.age += dt;
      if (sp.age < 1.5) {
        const dv = Math.min(sp.vol * dt / 1.5, Math.max(0, p.base ** 3 - 0.06 ** 3));
        p.base = p.goal = Math.cbrt(p.base ** 3 - dv);
        b.base = b.goal = Math.cbrt(b.base ** 3 + dv);
      }
      sp.w = 1 - smooth(1.0, 3.2, sp.age);
      if (sp.age > 3.2) {
        b.split = null;
        b.coolWith = p;
        b.coolUntil = sim.t + 8;
      }
    }

    // fusing: a neck forms, then the smaller blob drains into the larger
    for (const b of blobs) {
      if (!b.active || !b.fuse) continue;
      const a = rootOf(b.fuse.into);
      b.fuse.into = a;
      b.fuse.age += dt;
      b.fuse.w = Math.min(1, b.fuse.w + dt / 0.7);
      const pull = Math.min(1, dt * 0.9);
      b.x += (a.x - b.x) * pull; b.y += (a.y - b.y) * pull; b.z += (a.z - b.z) * pull;
      b.vx = a.vx; b.vy = a.vy; b.vz = a.vz;
      const mt = (a.temp - b.temp) * Math.min(1, dt * 1.5);
      b.temp += mt; a.temp -= mt * 0.3;
      b.r = b.base * S.size;
      if (b.fuse.age > 0.5) {
        const vb = b.base ** 3;
        const dv = Math.min(vb, Math.max(vb, 0.0003) * dt * 0.9);
        b.base = b.goal = Math.cbrt(vb - dv);
        a.base = Math.min(MAX_BASE, Math.cbrt(a.base ** 3 + dv));
        a.goal = a.base;
        if (b.base < 0.035) {
          a.base = Math.min(MAX_BASE, Math.cbrt(a.base ** 3 + b.base ** 3));
          a.goal = a.base;
          a.mass += b.mass;
          a.cap = Math.min(2.2, a.cap * 1.1);
          b.active = false;
          b.fuse = null;
          for (const o of blobs) if (o.fuse && o.fuse.into === b) o.fuse.into = a;
        }
      }
    }

    for (const b of blobs) {
      if (!b.active) continue;
      // landing / docking: on the pool surface, or on a blob resting in it
      const onMound = b.state === 'free' && b.vy < 0 && blobs.some(o => {
        if (!o.active || o.state !== 'pool') return false;
        const d = Math.hypot(b.x - o.x, b.y - o.y, b.z - o.z) || 1e-4;
        const ny = (b.y - o.y) / d;
        return d < reach(b, ny) + reach(o, ny) + FILM;
      });
      if (b.state === 'free' && b.vy < 0 && (onMound || b.y - reach(b, 1) <= poolY() + 0.015)) {
        // each landing rolls a new temperament so the blobs never fall into step
        b.state = 'pool';
        b.cap = rand(0.5, 1.8);
        b.rise = rand(0.68, 0.8);
        // merged wax melts back into the pool and buds off as separate blobs again
        if (b.mass > 1) {
          for (const o of blobs) {
            if (b.mass <= 1) break;
            if (!o.active) { respawn(o, b); b.mass--; }
          }
          b.mass = 1;
          b.goal = newBase();
        }
      }
      if (b.state === 'free' && b.y >= topY(b) - 0.01 && b.vy > 0) b.state = 'top';
      contain(b);

      // stretch along the direction of travel
      const sT = b.state === 'free' ? 1 + Math.min(Math.abs(b.vy) * 3.2, 0.55)
               : b.state === 'top' ? 0.86 : 0.95;
      b.s += (sT - b.s) * (1 - Math.exp(-dt * 2));
    }

    // settle: the glass and the film both have to hold at once
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < blobs.length; i++) {
        if (!separable(blobs[i])) continue;
        for (let j = i + 1; j < blobs.length; j++) {
          if (separable(blobs[j])) separate(blobs[i], blobs[j], (blobs[i].id * 1.7 + blobs[j].id * 2.3) % 6.283);
        }
      }
      for (const b of blobs) if (b.active && b.state !== 'pool') contain(b);
    }
  }

  // Shader order: pool blobs, then free blobs grouped so a fusing blob follows the blob it joins.
  function renderList() {
    const list = sim.blobs.filter(b => b.active);
    const key = b => b.state === 'pool' ? -1 : clusterId(b) + (b.fuse || b.split ? 0.5 : 0);
    return list.sort((a, b) => key(a) - key(b));
  }
  // SIM-END -----------------------------------------------------------------

  // ---- WebGL -----------------------------------------------------------------
  const canvas = document.getElementById('gl');
  const errEl = document.getElementById('err');
  const root = document.documentElement;

  function fail(msg, detail) {
    errEl.textContent = msg;
    errEl.hidden = false;
    root.dataset.status = 'error: ' + (detail || msg);
  }

  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' })
          || canvas.getContext('experimental-webgl');
  if (!gl) { fail('This lamp needs WebGL, which this browser has turned off.'); return; }

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) {
    fail('The lamp could not start on this device.', String(e.message || e));
    return;
  }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for (const n of ['uRes', 'uRegion', 'uTime', 'uRot', 'uPitch', 'uZoom', 'uBlobs', 'uInfo', 'uCount',
                   'uWax', 'uLiquid', 'uGlow', 'uMetal', 'uRough', 'uHaze', 'uBulb', 'uGoo', 'uPoolY', 'uEta',
                   'uTarget', 'uDist', 'uLid', 'uBoxMin', 'uBoxMax', 'uText']) {
    U[n] = gl.getUniformLocation(prog, n);
  }
  const blobData = new Float32Array(MAXB * 4);
  const infoData = new Float32Array(MAXB * 4);

  const hexToLinear = hex => {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.pow(v / 255, 2.2));
  };

  // ---- View ------------------------------------------------------------------
  const hero = document.getElementById('hero');
  const panel = document.getElementById('panel');
  const cue = document.getElementById('cue');
  const view = { yaw: 0, yawVel: 0, pitch: 0.1, bulb: S.power ? 1 : 0 };
  let renderScale = S.quality;

  // ---- Lid ---------------------------------------------------------------------
  // Double-click the lid to lift it off and set it on the floor beside the lamp,
  // showing the bottle cap sealing the globe. Double-click it again (or press Esc)
  // to put it back.
  const CY0 = 1.38, CY1 = 1.95;
  const SIGNATURE = 'Elliott';
  const lid = { open: false, t: 0 };
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  const lerp = (a, b, t) => a + (b - a) * t;
  let cam = { target: [0, -0.02, 0], dist: 7, pitch: 0.1 };

  const LID_REST = [0.75, 0.95];  // on the floor, front and to the side, clear of the base
  function lidPose(t) {
    const lift = ease(t / 0.35);
    const move = ease((t - 0.3) / 0.7);
    const rest = -2.0 - CY0 + 0.016;   // standing on the floor
    return [LID_REST[0] * move, lerp(0.45 * lift, rest, move) + 0.3 * Math.sin(Math.PI * move),
            LID_REST[1] * move, 0.5 * Math.sin(Math.PI * move)];
  }

  function rayAt(clientX, clientY) {
    const vh = canvas.clientHeight, vw = canvas.clientWidth;
    const free = Math.min(vh, Math.max(vh * 0.36, panel.getBoundingClientRect().top));
    const ux = (clientX - vw / 2) / free;
    const uy = (free / 2 - clientY) / free;
    const [tx, ty, tz] = cam.target;
    const ro = [tx, ty + cam.dist * Math.sin(cam.pitch), tz + cam.dist * Math.cos(cam.pitch)];
    const fw = [tx - ro[0], ty - ro[1], tz - ro[2]];
    const fl = Math.hypot(...fw);
    fw.forEach((v, i) => fw[i] = v / fl);
    const rt = [-fw[2], 0, fw[0]];
    const rl = Math.hypot(...rt);
    rt.forEach((v, i) => rt[i] = v / rl);
    const up = [rt[1] * fw[2] - rt[2] * fw[1], rt[2] * fw[0] - rt[0] * fw[2], rt[0] * fw[1] - rt[1] * fw[0]];
    const f = 1.38 * S.zoom;
    const rd = [0, 1, 2].map(i => ux * rt[i] + uy * up[i] + f * fw[i]);
    const dl = Math.hypot(...rd);
    return { ro, rd: rd.map(v => v / dl) };
  }
  // is the pointer over the lid, wherever it is resting?
  function overLid(clientX, clientY) {
    if (lid.t > 0 && lid.t < 1) return false;
    const [ox, oy, oz] = lidPose(lid.t);
    const { ro, rd } = rayAt(clientX, clientY);
    for (let t = 0; t < 14; t += 0.01) {
      const y = ro[1] + rd[1] * t - oy;
      if (y < CY0 - 0.04 || y > CY1 + 0.01) continue;
      const capR = 0.27 - 0.14 * Math.min(1, Math.max(0, (y - CY0) / (CY1 - CY0)));
      if (Math.hypot(ro[0] + rd[0] * t - ox, ro[2] + rd[2] * t - oz) < capR + 0.02) return true;
    }
    return false;
  }

  // double taps are detected here so touch screens behave like a mouse double-click
  let lastTap = null;
  function onTap(x, y) {
    const now = performance.now();
    if (lastTap && now - lastTap.t < 350 && Math.hypot(x - lastTap.x, y - lastTap.y) < 30) {
      lastTap = null;
      if (overLid(x, y)) lid.open = !lid.open;
      else view.pitch = 0.1;
    } else {
      lastTap = { x, y, t: now };
    }
  }
  window.addEventListener('keydown', e => { if (e.key === 'Escape') lid.open = false; });

  // the lettering, drawn once in script and again when the web font arrives
  const textTex = gl.createTexture();
  function drawSignature() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    const font = px => `${px}px "Great Vibes", "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", cursive`;
    let size = 170;
    g.font = font(size);
    const w = g.measureText(SIGNATURE).width;
    if (w > 390) { size *= 390 / w; g.font = font(size); }
    g.fillStyle = '#fff';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(SIGNATURE, 256, 262);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  drawSignature();
  gl.uniform1i(U.uText, 0);
  if (document.fonts) document.fonts.load('170px "Great Vibes"').then(drawSignature).catch(() => {});

  let drag = null;
  hero.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    drag = { x: e.clientX, y: e.clientY, t: performance.now(), x0: e.clientX, y0: e.clientY, t0: performance.now() };
    view.yawVel = 0;
    hero.setPointerCapture(e.pointerId);
    hero.classList.add('dragging');
  });
  hero.addEventListener('pointermove', e => {
    if (!drag) {
      if (e.pointerType === 'mouse') hero.style.cursor = overLid(e.clientX, e.clientY) ? 'pointer' : '';
      return;
    }
    const now = performance.now();
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    const dts = Math.max((now - drag.t) / 1000, 1 / 240);
    view.yaw += dx * 0.008;
    view.yawVel = view.yawVel * 0.6 + (dx * 0.008 / dts) * 0.4;
    if (e.pointerType === 'mouse') view.pitch = Math.min(1.1, Math.max(-0.05, view.pitch + dy * 0.003));
    Object.assign(drag, { x: e.clientX, y: e.clientY, t: now });
  });
  const endDrag = () => { drag = null; hero.classList.remove('dragging'); };
  hero.addEventListener('pointerup', e => {
    if (drag && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6 && performance.now() - drag.t0 < 500) {
      onTap(e.clientX, e.clientY);
    }
    endDrag();
  });
  hero.addEventListener('pointercancel', () => { view.yawVel = 0; endDrag(); });

  cue.addEventListener('click', () => {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
  });

  // ---- Frame loop ----------------------------------------------------------
  const fps = { ema: 16.7, lastAdjust: 0, shown: 0 };
  let readoutEl = null;
  let last = performance.now();

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr * renderScale));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr * renderScale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  function frame(now) {
    const dtMs = Math.min(now - last, 250);
    last = now;
    const dt = dtMs / 1000;

    // power: the bulb answers quickly, the wax takes a while to warm or cool
    const on = S.power ? 1 : 0;
    view.bulb += (on - view.bulb) * (1 - Math.exp(-dt * 2.5));
    sim.heat += (on - sim.heat) * (1 - Math.exp(-dt * 0.2));

    const simDt = Math.min(dt, 1 / 20) * S.flow;
    const steps = Math.max(1, Math.ceil(simDt / (1 / 60)));
    for (let i = 0; i < steps; i++) stepSim(simDt / steps);

    lid.t = Math.min(1, Math.max(0, lid.t + (lid.open ? dt : -dt) / 2.2));
    if (!drag) {
      view.yaw += view.yawVel * dt;
      view.yawVel *= Math.exp(-dt * 2.5);
      if (S.autorotate) view.yaw += dt * S.spin * 0.6;
    }
    cam.pitch = view.pitch;
    const lidAt = lidPose(lid.t);

    // adaptive resolution
    fps.ema += (dtMs - fps.ema) * 0.05;
    if (S.adaptive && now - fps.lastAdjust > 1000) {
      if (fps.ema > 22 && renderScale > 0.35) { renderScale = Math.max(0.35, renderScale * 0.85); fps.lastAdjust = now; }
      else if (fps.ema < 18 && renderScale < S.quality) { renderScale = Math.min(S.quality, renderScale * 1.1); fps.lastAdjust = now; }
    }
    if (readoutEl && now - fps.shown > 500) {
      fps.shown = now;
      readoutEl.textContent = `${Math.round(1000 / fps.ema)} fps · ${canvas.width}×${canvas.height}`;
    }

    resize();

    // the lamp sits in whatever part of the screen the controls leave free
    const vh = canvas.clientHeight || window.innerHeight;
    const px = canvas.height / vh;
    const free = Math.min(vh, Math.max(vh * 0.36, panel.getBoundingClientRect().top));
    cue.style.opacity = Math.max(0, 1 - window.scrollY / 120) * 0.55;

    const blobs = renderList();
    const n = Math.min(blobs.length, MAXB);
    for (let i = 0; i < n; i++) {
      const b = blobs[i];
      blobData.set([b.x, b.y, b.z, b.r], i * 4);
      infoData.set([b.s, b.state === 'pool' ? 2 + b.poolW : b.poolW, clusterId(b), blend(b)], i * 4);
    }

    const wax = hexToLinear(S.wax), liquid = hexToLinear(S.liquid);
    const bulb = S.bulb * (0.05 + 0.95 * view.bulb);
    const fin = FINISHES[S.finish] || FINISHES.chrome;

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform2f(U.uRegion, canvas.height - free * px * 0.5, free * px);
    gl.uniform1f(U.uTime, sim.t);
    gl.uniform2f(U.uRot, Math.cos(view.yaw), Math.sin(view.yaw));
    gl.uniform1f(U.uPitch, cam.pitch);
    gl.uniform3fv(U.uTarget, cam.target);
    gl.uniform1f(U.uDist, cam.dist);
    gl.uniform4fv(U.uLid, lidAt);
    gl.uniform3f(U.uBoxMin, Math.min(-0.85, lidAt[0] - 0.55), Math.min(-2.0, lidAt[1] + CY0 - 0.25), Math.min(-0.85, lidAt[2] - 0.55));
    gl.uniform3f(U.uBoxMax, Math.max(0.85, lidAt[0] + 0.55), Math.max(1.97, lidAt[1] + CY1 + 0.25), Math.max(0.85, lidAt[2] + 0.55));
    gl.uniform1f(U.uZoom, S.zoom);
    gl.uniform4fv(U.uBlobs, blobData);
    gl.uniform4fv(U.uInfo, infoData);
    gl.uniform1i(U.uCount, n);
    gl.uniform3fv(U.uWax, wax);
    gl.uniform3fv(U.uLiquid, liquid);
    gl.uniform3f(U.uGlow, ...[0, 1, 2].map(i => (liquid[i] * 0.4 + wax[i] * 0.6) * bulb));
    gl.uniform3fv(U.uMetal, fin.metal);
    gl.uniform1f(U.uRough, fin.rough);
    gl.uniform1f(U.uHaze, S.haze);
    gl.uniform1f(U.uBulb, bulb);
    gl.uniform1f(U.uGoo, S.goo);
    gl.uniform1f(U.uPoolY, poolY());
    gl.uniform1f(U.uEta, 1 / (1 + 0.3 * S.refraction));
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }

  // ---- Controls ------------------------------------------------------------
  const pct = v => Math.round(v * 100) + '%';
  const times = v => v.toFixed(2).replace(/0$/, '') + '×';
  const GROUPS = [
    { title: 'Presets', presets: true },
    { title: 'Power & heat', items: [
      { key: 'power', type: 'toggle', label: 'Power' },
      { key: 'heat', type: 'range', label: 'Heat', min: 0.4, max: 1, step: 0.01, fmt: pct },
      { key: 'flow', type: 'range', label: 'Flow speed', min: 0.25, max: 4, step: 0.05, fmt: times },
      { key: 'viscosity', type: 'range', label: 'Viscosity', min: 0.4, max: 2.5, step: 0.05, fmt: times },
    ] },
    { title: 'Wax', items: [
      { key: 'wax', type: 'color', label: 'Colour' },
      { key: 'amount', type: 'range', label: 'Amount', min: 3, max: MAXB, step: 1, fmt: v => v + ' blobs' },
      { key: 'size', type: 'range', label: 'Blob size', min: 0.6, max: 1.5, step: 0.01, fmt: times },
      { key: 'goo', type: 'range', label: 'Gooeyness', min: 0.3, max: 2.2, step: 0.01, fmt: times },
    ] },
    { title: 'Liquid & light', items: [
      { key: 'liquid', type: 'color', label: 'Liquid colour' },
      { key: 'haze', type: 'range', label: 'Haze', min: 0, max: 1, step: 0.01, fmt: pct },
      { key: 'bulb', type: 'range', label: 'Bulb brightness', min: 0.2, max: 2, step: 0.01, fmt: pct },
    ] },
    { title: 'Lamp', items: [
      { key: 'finish', type: 'choice', label: 'Base finish', options: FINISHES },
      { key: 'refraction', type: 'range', label: 'Glass refraction', min: 0, max: 1, step: 0.01, fmt: pct },
    ] },
    { title: 'View', items: [
      { key: 'autorotate', type: 'toggle', label: 'Turntable' },
      { key: 'spin', type: 'range', label: 'Turn speed', min: 0.02, max: 1, step: 0.01, fmt: pct },
      { key: 'zoom', type: 'range', label: 'Zoom', min: 0.7, max: 1.8, step: 0.01, fmt: times },
    ] },
    { title: 'Performance', items: [
      { key: 'quality', type: 'range', label: 'Render quality', min: 0.35, max: 1, step: 0.05, fmt: pct },
      { key: 'adaptive', type: 'toggle', label: 'Lower quality when slow' },
      { type: 'readout' },
    ] },
  ];

  const CHEVRON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const syncers = [];
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  function onChange(key) {
    if (key === 'amount') syncBlobCount();
    if (key === 'quality') renderScale = S.quality;
    if (key === 'wax') root.style.setProperty('--accent', S.wax);
    save();
  }

  function buildItem(it) {
    if (it.type === 'readout') {
      const row = el('div', 'row-inline', '<span>Frame rate</span>');
      readoutEl = el('span', 'readout', '–');
      row.append(readoutEl);
      return row;
    }
    const id = 'c-' + it.key;
    if (it.type === 'range') {
      const row = el('div');
      const head = el('div', 'row-head');
      const lab = el('label', null, it.label); lab.htmlFor = id;
      const val = el('span', 'val');
      head.append(lab, val);
      const input = el('input');
      Object.assign(input, { type: 'range', id, min: it.min, max: it.max, step: it.step });
      const paint = () => {
        val.textContent = it.fmt(S[it.key]);
        input.style.setProperty('--p', ((S[it.key] - it.min) / (it.max - it.min) * 100) + '%');
      };
      input.addEventListener('input', () => { S[it.key] = Number(input.value); paint(); onChange(it.key); });
      syncers.push(() => { input.value = S[it.key]; paint(); });
      row.append(head, input);
      return row;
    }
    if (it.type === 'toggle') {
      const row = el('div', 'row-inline');
      const lab = el('span', null, it.label); lab.id = id + '-l';
      const sw = el('button', 'switch');
      sw.type = 'button';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-labelledby', lab.id);
      sw.addEventListener('click', () => { S[it.key] = !S[it.key]; sw.setAttribute('aria-checked', S[it.key]); onChange(it.key); });
      syncers.push(() => sw.setAttribute('aria-checked', S[it.key]));
      row.append(lab, sw);
      return row;
    }
    if (it.type === 'color') {
      const row = el('div', 'row-inline');
      const lab = el('label', null, it.label); lab.htmlFor = id;
      const input = el('input');
      Object.assign(input, { type: 'color', id });
      input.addEventListener('input', () => { S[it.key] = input.value; onChange(it.key); });
      syncers.push(() => { input.value = S[it.key]; });
      row.append(lab, input);
      return row;
    }
    if (it.type === 'choice') {
      const row = el('div');
      row.append(el('div', 'row-head', `<span>${it.label}</span>`));
      const chips = el('div', 'chips');
      const btns = Object.entries(it.options).map(([k, o]) => {
        const b = el('button', 'chip', o.label);
        b.type = 'button';
        b.addEventListener('click', () => { S[it.key] = k; syncAll(); onChange(it.key); });
        chips.append(b);
        return [k, b];
      });
      syncers.push(() => btns.forEach(([k, b]) => b.setAttribute('aria-pressed', S[it.key] === k)));
      row.append(chips);
      return row;
    }
  }

  function buildPresets() {
    const chips = el('div', 'chips');
    const btns = PRESETS.map(p => {
      const b = el('button', 'chip', `<span class="dots"><i style="background:${p.wax}"></i><i style="background:${p.liquid}"></i></span>${p.name}`);
      b.type = 'button';
      b.addEventListener('click', () => {
        Object.assign(S, { wax: p.wax, liquid: p.liquid, haze: p.haze, finish: p.finish });
        syncAll();
        onChange('wax');
      });
      chips.append(b);
      return [p, b];
    });
    const rnd = el('button', 'chip', 'Random');
    rnd.type = 'button';
    rnd.addEventListener('click', () => {
      const hsl = (h, s, l) => {
        const f = n => { const k = (n + h / 30) % 12; const c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
        return '#' + f(0) + f(8) + f(4);
      };
      const h = rand(0, 360);
      S.wax = hsl(h, 1, 0.55);
      S.liquid = hsl((h + rand(90, 270)) % 360, rand(0.6, 1), rand(0.55, 0.85));
      S.haze = Math.round(rand(0.2, 0.5) * 100) / 100;
      S.finish = Object.keys(FINISHES)[Math.floor(rand(0, 5))];
      syncAll();
      onChange('wax');
    });
    chips.append(rnd);
    syncers.push(() => btns.forEach(([p, b]) => b.setAttribute('aria-pressed', S.wax === p.wax && S.liquid === p.liquid)));
    return chips;
  }

  function syncAll() { syncers.forEach(f => f()); }

  const groupsEl = document.getElementById('groups');
  for (const g of GROUPS) {
    const d = el('details');
    d.append(el('summary', null, `<span>${g.title}</span>${CHEVRON}`));
    const body = el('div', 'group-body');
    if (g.presets) body.append(buildPresets());
    for (const it of g.items || []) body.append(buildItem(it));
    d.append(body);
    groupsEl.append(d);
  }

  document.getElementById('reset').addEventListener('click', () => {
    Object.assign(S, DEFAULTS);
    renderScale = S.quality;
    view.pitch = 0.1;
    syncBlobCount();
    syncAll();
    onChange('wax');
  });

  root.style.setProperty('--accent', S.wax);
  syncAll();

  // ---- Start -----------------------------------------------------------------
  // Begin mid-cycle so the first look is already alive, not a cold puddle.
  const params = new URLSearchParams(location.search);
  seedBlobs();
  const warm = 8 + Number(params.get('sim') || 0);
  for (let t = 0; t < warm; t += 1 / 30) stepSim(1 / 30);
  if (params.has('scale')) { S.adaptive = false; renderScale = Number(params.get('scale')); }
  if (params.has('yaw')) view.yaw = Number(params.get('yaw'));
  if (params.has('panel')) {
    document.querySelectorAll('details').forEach((d, i) => { if (i < 2) d.open = true; });
    requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
  }

  root.dataset.status = 'ok';
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
